<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Web Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #222;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #1e293b;
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: #fff;
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-bottom: 0.75rem;
      color: #0f172a;
    }

    p {
      margin-bottom: 1.25rem;
      color: #475569;
    }

    button {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <strong>My Website</strong>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Welcome!</h1>
      <p>This is a clean, responsive HTML5 template ready for your project.</p>
      <button id="actionBtn">Click Me</button>
    </div>
  </main>

  <footer>
    &copy; 2026 My Website. All rights reserved.
  </footer>

  <script>
    document.getElementById("actionBtn").addEventListener("click", () => {
      alert("Hello! Your HTML page is working.");
    });
  </script>

</body>
</html>
